name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      # Docs are deployed to GitHub Pages, which needs `pages: write` /
      # `id-token: write`. Those permissions are not granted to pull requests
      # from forks, and a fork has no Pages site to deploy to, so restrict this
      # step to direct pushes to `main` on this repository. Every other trigger
      # (PRs, other branches, forks, workflow_dispatch) still runs the build.
      - uses: leanprover-community/docgen-action@v1
        if: >-
          github.event_name == 'push'
          && github.ref == 'refs/heads/main'
          && !github.event.repository.fork
